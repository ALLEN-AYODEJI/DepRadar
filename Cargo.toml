[workspace]
resolver = "2"
members = [
  "contracts/deprader_router",
]

[workspace.dependencies]
soroban-sdk = "22.0.0"

# Root crate: the off-chain side of DepRadar (crawler + scanner modules).
# The on-chain bounty router lives in its own crate under contracts/.
[package]
name = "deprader"
version = "0.1.0"
edition = "2021"
publish = false
description = "DepRadar off-chain crawler/scanner toolkit"

[lib]
path = "src/lib.rs"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
